<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <g transform="translate(256,256)">
    <!-- Book -->
    <path d="M-120,-80 C-120,-100 -80,-120 0,-100 C80,-120 120,-100 120,-80 L120,80 C120,100 80,110 0,90 C-80,110 -120,100 -120,80 Z" fill="none" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="0" y1="-100" x2="0" y2="90" stroke="white" stroke-width="8" stroke-linecap="round"/>
    <!-- A letter -->
    <text x="-55" y="25" font-family="Georgia, serif" font-size="90" font-weight="bold" fill="white" text-anchor="middle">A</text>
    <!-- a letter -->
    <text x="60" y="25" font-family="Georgia, serif" font-size="80" font-weight="bold" fill="rgba(255,255,255,0.85)" text-anchor="middle">a</text>
